<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure 人工标注</title><link rel="stylesheet" href="/front_end/workbench.css"></head><body>
<header><h1><a href="/">材料手册工作台</a> / 图像标注</h1><select id="manual" aria-label="手册"></select></header>
<div class="editor-shell" id="shell"><aside class="sidebar"><div class="side-tools"><strong>Figure 来源页</strong><input id="search" type="search" placeholder="搜索编号或标题" aria-label="搜索 Figure"><select id="filter" aria-label="过滤状态"><option value="all">全部状态</option><option value="ready">可标注</option><option value="verified">已确认</option><option value="pending">待模型处理</option></select><p id="counts" class="muted"></p></div><div id="list" class="list"></div></aside>
<div id="sidebar-divider" class="divider" tabindex="0" role="separator" aria-label="调整 Figure 列表宽度" aria-orientation="vertical"></div>
<main class="figure-main"><div class="toolbar"><strong id="title">请选择 Figure</strong><span class="state" id="state"></span><button id="toggle-source">显示原 PDF</button><button id="save" disabled>保存草稿</button><button class="primary" id="verify" disabled>确认标注</button></div><div id="editor-message" role="status"></div>
<div class="figure-panes collapsed" id="panes"><section class="source-pane"><div class="source-tools"><strong id="source-label">原PDF来源</strong><button id="zoom-out" aria-label="缩小来源页">⌕ −</button><button id="zoom-in" aria-label="放大来源页">⌕ ＋</button><a id="pdf" target="_blank" rel="noopener">打开 PDF</a></div><img id="source" alt="原 PDF 来源页"></section><div id="source-divider" class="divider" tabindex="0" role="separator" aria-label="调整原 PDF 与 WPD 宽度" aria-orientation="vertical"></div><section class="wpd-host"><iframe id="wpd" src="/wpd/" title="WebPlotDigitizer 5.3 标注编辑器"></iframe><div class="placeholder" id="placeholder">准备好 TAR 的 Figure 可直接打开。模型处理由 Codex 跟进。</div></section></div></main></div>
<script>
const $=id=>document.getElementById(id);let manual='',items=[],current=null,baseline='',loading=false,saving=false,zoom=1;
const bridge=()=>$('wpd').contentWindow?.workbench;
function dirty(){return !!current?.ready&&!loading&&!!baseline&&bridge()?.snapshot()!==baseline;}
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error((await r.json()).error||r.statusText);return r;}
function query(item=current,extra={}){return new URLSearchParams({manual,id:item.id,...extra});}
function message(text){$('editor-message').textContent=text;}
function state(){const changed=dirty();$('state').textContent=changed?'有未保存修改':({unreviewed:'未确认',draft:'草稿',verified:'已确认'}[current?.review_status]||'');$('state').className='state '+(!changed?current?.review_status:'');$('save').disabled=$('verify').disabled=!current?.ready||loading||saving;}
function list(){const search=$('search').value.toLowerCase(),filter=$('filter').value;$('counts').textContent=`${items.length} 张 · ${items.filter(i=>i.ready).length} 张可标注`;$('list').replaceChildren();for(const item of items){if(!(item.id+' '+item.caption).toLowerCase().includes(search)||filter==='ready'&&!item.ready||filter==='verified'&&item.review_status!=='verified'||filter==='pending'&&item.ready)continue;const b=document.createElement('button');b.className='item'+(current?.id===item.id?' selected':'');const title=document.createElement('strong');title.textContent=item.id;title.title=item.caption;const detail=document.createElement('small');detail.textContent=`页 ${item.page} · ${item.ready?({verified:'已确认',draft:'草稿',unreviewed:'待标注'}[item.review_status]):'待模型处理'}`;b.append(title,detail);b.onclick=()=>open(item).catch(e=>message(e.message));$('list').append(b);}}
async function refresh(){if(!manual)return;items=await (await api('/api/figures?'+new URLSearchParams({manual}))).json();list();}
async function choose(name){if(loading||saving){$('manual').value=manual;return;}if(dirty()&&!confirm('当前修改尚未保存，确定切换手册吗？')){$('manual').value=manual;return;}manual=name;current=null;baseline='';$('placeholder').hidden=false;await refresh();const item=items.find(i=>i.ready)||items[0];if(item)await open(item);else state();}
async function open(item){if(loading||saving)return;if(dirty()&&!confirm('当前修改尚未保存，确定切换 Figure 吗？'))return;current=item;baseline='';loading=true;list();state();message('');$('title').textContent=item.id+(item.caption?' · '+item.caption.replace(/^Figure\s+[\d.]+\s*/, ''):'');$('placeholder').hidden=false;$('placeholder').textContent=item.ready?'正在载入 WPD 项目…':'该图尚未生成可标注 TAR，请让 Codex 检查处理进度。';$('source-label').textContent='原PDF来源：页'+item.page;$('source').src='/api/source-image?'+query(item,{page:item.page});$('pdf').href='/api/source?'+query(item,{page:item.page});zoom=1;$('source').style.width='100%';
try{if(item.ready){if(!bridge()?.ready)await new Promise((resolve,reject)=>{const start=Date.now();const timer=setInterval(()=>{if(bridge()?.ready){clearInterval(timer);resolve();}else if(Date.now()-start>15000){clearInterval(timer);reject(Error('WPD 未加载，请刷新后重试'));}},100);});const blob=await (await api('/api/figure-tar?'+query(item))).blob();baseline=await bridge().load(blob);$('placeholder').hidden=true;}}catch(e){current={...current,ready:false};throw e;}finally{loading=false;state();}}
async function save(status){if(!current?.ready||loading||saving)return;saving=true;state();const item=current;try{const snapshot=bridge().snapshot();const blob=await bridge().archive(snapshot);const saved=await (await api('/api/figure-save?'+query(item,{version:JSON.stringify(item.version),status}),{method:'POST',headers:{'Content-Type':'application/x-tar'},body:blob})).json();baseline=snapshot;current=saved;message(status==='verified'?'已确认并保存。':'草稿已保存。');await refresh();}catch(e){message(e.message);}finally{saving=false;state();}}
function resize(id,host,min,max){let start=0,width=0;const bar=$(id);const set=v=>{host.style.gridTemplateColumns=Math.min(max(),Math.max(min,v))+'px 8px minmax(0,1fr)';};bar.onpointerdown=e=>{if(e.button!==0)return;start=e.clientX;width=host.children[0].getBoundingClientRect().width;bar.setPointerCapture(e.pointerId);document.body.classList.add('resizing');};bar.onpointermove=e=>{if(bar.hasPointerCapture(e.pointerId))set(width+e.clientX-start);};bar.onpointerup=bar.onpointercancel=e=>{if(bar.hasPointerCapture(e.pointerId))bar.releasePointerCapture(e.pointerId);document.body.classList.remove('resizing');};bar.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();set(host.children[0].getBoundingClientRect().width+(e.key==='ArrowLeft'?-20:20));}};}
resize('sidebar-divider',$('shell'),150,()=>500);resize('source-divider',$('panes'),180,()=>Math.max(180,$('panes').clientWidth-500));$('toggle-source').onclick=()=>{const hidden=$('panes').classList.toggle('collapsed');$('panes').style.gridTemplateColumns='';$('toggle-source').textContent=hidden?'显示原 PDF':'收起原 PDF';};$('zoom-out').onclick=()=>{zoom=Math.max(.4,zoom-.2);$('source').style.width=zoom*100+'%';};$('zoom-in').onclick=()=>{zoom=Math.min(4,zoom+.2);$('source').style.width=zoom*100+'%';};$('save').onclick=()=>save('draft');$('verify').onclick=()=>save('verified');$('search').oninput=$('filter').onchange=list;$('manual').onchange=e=>choose(e.target.value).catch(e=>message(e.message));window.onbeforeunload=e=>{if(dirty()||saving){e.preventDefault();e.returnValue='';}};
(async()=>{const all=await (await api('/api/overview')).json();const names=all.filter(i=>i.intake).map(i=>i.name);$('manual').replaceChildren(...names.map(n=>new Option(n,n)));const selected=new URLSearchParams(location.search).get('manual');if(names.length){$('manual').value=names.includes(selected)?selected:names[0];await choose($('manual').value);}})().catch(e=>message(e.message));setInterval(()=>{if(!loading&&!saving){state();refresh().catch(e=>message(e.message));}},3000);
</script></body></html>
