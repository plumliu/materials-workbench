<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料手册工作台</title><link rel="stylesheet" href="/front_end/workbench.css"></head>
<body><header><h1>材料手册工作台</h1></header>
<main class="overview"><div class="heading"><div><p class="eyebrow">手册总览</p><h2>图像与表格，并行推进</h2><p class="muted">接收手册后即可手工标注图像，也可按图启动智能识别；表格处理由 Codex 跟进。</p></div><label>当前手册 <select id="manual" aria-label="当前手册"></select></label></div>
<p id="message" role="status"></p><div id="empty" hidden class="card">请将手册 PDF 放入本仓库的 <code>pdfs/</code>，再刷新页面。也可以直接让 Codex 帮你放入。</div>
<div id="content" hidden><section class="card intake"><div><h3>1 · 接收手册</h3><p id="intake-status" class="muted"></p></div><button id="intake" class="primary">开始 intake</button></section>
<div class="branches"><section class="card"><span class="eyebrow">图像</span><h3>直接手工标注 · 可选智能识别</h3><p id="figure-state" class="muted"></p><progress id="figure-progress" value="0" max="1"></progress><div id="figure-counts" class="counts"></div><a id="figures" class="button primary">进入图像标注</a></section>
<section class="card"><span class="eyebrow">表格</span><h3>OCR / Luna → 人工核验</h3><p id="table-state" class="muted"></p><progress id="table-progress" value="0" max="1"></progress><div id="table-counts" class="counts"></div><a id="tables" class="button primary">进入表格核验</a></section></div>
<section class="card assembly"><div><h3>最后 · 组装 library</h3><p class="muted">已确认的人工修订将在组装时应用。重复组装会更新本手册的成品目录。</p><label><input type="checkbox" id="incomplete"> 允许带未完成项组装，并在成品中记录完成情况</label><p id="assembly-status" role="status"></p><ul id="assembly-reasons"></ul><p id="assembly-hint" class="muted"></p><p id="assembly-result" class="muted"></p></div><button id="assemble" aria-describedby="assembly-status assembly-hint">组装手册</button></section>
<details class="card" id="diagnostics"><summary id="issues-summary">问题详情与操作记录</summary><div class="issue-tools"><span class="muted">包含具体对象、页码、相关文件和下一步建议。</span><button id="copy-issues">复制给 Codex</button><span id="copy-status" role="status"></span></div><textarea id="copy-fallback" aria-label="问题详情，可全选复制" readonly hidden></textarea><div id="issues"></div></details></div></main>
<script>
const $ = id => document.getElementById(id);
let records = [], selected = '', issueSnapshot = '';
const labels = {running:'处理中', completed:'模型处理已完成', waiting_luna:'等待 Codex 派发 / 应用 Luna 审阅', needs_resolution:'需要 Codex 检查', failed:'处理出错，详见下方记录', interrupted:'处理已中断', blocked:'暂不能组装'};
const actions = {intake:'接收手册', figures:'图像识别', tables:'表格处理', 'apply-luna':'应用 Luna 审阅', assemble:'组装手册'};
const processing = {pending:'尚未记录模型处理结果', running:'模型正在处理', failed:'模型处理失败', needs_resolution:'模型结果需要检查', exported:'模型已导出结果'};
function element(tag, text, className = '') {
  const node = document.createElement(tag);
  node.textContent = text;
  node.className = className;
  return node;
}
async function api(url, options) {
  const r = await fetch(url, options), d = await r.json();
  if (!r.ok) throw Object.assign(Error(d.error || r.statusText), {status:d.status});
  return d;
}
function renderIssues(s) {
  const snapshot = JSON.stringify([s.name, s.issues, s.tasks]);
  if (snapshot === issueSnapshot) return;
  issueSnapshot = snapshot;
  const issues = [...s.issues];
  for (const [key, task] of Object.entries(s.tasks)) {
    if (!['failed', 'interrupted'].includes(task.status)) continue;
    issues.push({
      code:`task_${key}_${task.status}`, subject:`上次${actions[key] || key}未完成`,
      message:task.error || '处理进程已结束，但没有留下完成记录。',
      next_step:key === 'assemble' ? '先检查上方当前组装条件；条件满足后仍报错，请 Codex 检查任务记录。' : '请 Codex 检查任务记录与对应处理产物，确认原因后再重试。',
      started:task.started, files:[`runs/${s.name}/tasks/${key}.json`]
    });
  }
  $('issues-summary').textContent = `问题详情与操作记录（${issues.length} 项）`;
  $('issues').replaceChildren();
  for (const issue of issues) {
    const card = element('article', '', 'issue');
    card.append(element('h4', issue.subject || '来源识别问题'), element('p', issue.message));
    if (issue.title) card.append(element('p', `目录标题：${issue.title}`, 'muted'));
    const locations = [];
    if (Number.isInteger(issue.page)) locations.push(`内容页：原 PDF 第 ${issue.page} 页`);
    else if (issue.code.startsWith('catalog_')) locations.push('内容页：尚未定位，不能将目录页当作图表内容页');
    if (issue.catalog_pages?.length) locations.push(`目录条目：原 PDF 第 ${issue.catalog_pages.join('、')} 页`);
    if (locations.length) card.append(element('p', locations.join('；'), 'muted'));
    if (issue.processing_status) card.append(element('p', `模型状态：${processing[issue.processing_status] || issue.processing_status}`));
    if (issue.started) card.append(element('p', `操作开始时间：${new Date(issue.started).toLocaleString()}`, 'muted'));
    card.append(element('p', `下一步：${issue.next_step}`));
    const detail = element('details', '', 'technical');
    detail.append(element('summary', '查看文件位置与问题代码'));
    detail.append(element('pre', `问题代码：${issue.code}\n手册：${s.name}\n相关文件 / 目录（路径不代表文件已生成）：\n${(issue.files || []).join('\n')}`));
    card.append(detail);
    $('issues').append(card);
  }
  if (!issues.length) $('issues').append(element('p', '暂无已记录的问题。'));
}
function render() {
  const s = records.find(r => r.name === selected);
  $('empty').hidden = !!records.length; $('content').hidden = !s;
  if (!s) return;
  const busy = Object.values(s.tasks).some(t => t.status === 'running');
  $('intake-status').textContent = s.intake ? `已完成 intake · ${s.pages} 页来源 PDF 已接收，Figure 清单已生成。` : labels[s.tasks.intake?.status] || '点击后生成来源页和 Figure 清单';
  $('intake').textContent = s.intake ? '✓ 已接收' : s.tasks.intake?.status === 'running' ? '接收中…' : '开始 intake';
  $('intake').classList.toggle('complete', s.intake);
  $('intake').disabled = s.intake || busy;
  $('assemble').disabled = !s.intake || busy;
  for (const [key, prefix] of [['figures', 'figure'], ['tables', 'table']]) {
    const c = s[key];
    $(prefix + '-progress').max = Math.max(c.total, 1);
    $(prefix + '-progress').value = c.verified;
    const unit = key === 'figures' ? '张' : '项';
    const counts = [`${c.ready} ${unit}${key === 'figures' ? '可标注' : '可核验'}`];
    if (c.missing) counts.push(`另 ${c.missing} 项目录${key === 'figures' ? '图' : '表'}缺少来源`);
    const pending = c.total - c.ready - c.missing;
    if (pending > 0) counts.push(`另 ${pending} ${unit}尚未就绪`);
    counts.push(`${c.verified} ${unit}已确认`);
    $(prefix + '-counts').textContent = counts.join(' · ');
    $(prefix + '-state').textContent = labels[s.tasks[key]?.status] || (s.intake ? (key === 'figures' ? '打开单页 PDF 即可手标，也可在图内点击智能识别' : '请让 Codex 启动处理') : '等待 intake');
    $(key).href = '/' + key + '?' + new URLSearchParams({manual:selected});
    $(key).setAttribute('aria-disabled', !s.intake);
  }
  const check = s.assembly, task = s.tasks.assemble;
  const blocked = check.required.length || (check.pending.length && !$('incomplete').checked);
  $('assembly-status').textContent = task?.status === 'running' ? '正在组装…' : busy ? '请等待当前处理结束后再组装。' : blocked ? '暂不能组装：以下条件尚未满足。' : check.pending.length ? '可以带未完成项组装，成品将标记为未完成。' : '所有核验已完成，可以组装。';
  $('assembly-status').className = blocked ? 'warning' : '';
  $('assembly-reasons').replaceChildren(...[...check.required, ...check.pending].map(reason => element('li', reason)));
  $('assembly-hint').textContent = check.required.length ? '请先完成上述准备；勾选复选框也不能跳过来源接收和表格处理。' : check.pending.length ? '完成核验后可正常组装；需要先查看阶段性成品时，可勾选上方“允许带未完成项组装”。' : '';
  $('assembly-result').textContent = task?.output ? `上次成品：${task.output}` : task?.status === 'failed' ? '上次组装未完成，原因见下方操作记录。' : '';
  renderIssues(s);
}
async function refresh() {
  records = await api('/api/overview');
  if (!records.some(r => r.name === selected)) selected = records[0]?.name || '';
  const names = records.map(r => r.name);
  if (JSON.stringify([...$('manual').options].map(o => o.value)) !== JSON.stringify(names)) $('manual').replaceChildren(...names.map(n => new Option(n, n)));
  $('manual').value = selected;
  render();
}
async function action(name) {
  $(name).disabled = true;
  $('message').textContent = '';
  try {
    await api('/api/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({manual:selected, action:name, allow_incomplete:$('incomplete').checked})});
    $('message').textContent = `${actions[name]}已启动，进度将在这里更新。`;
    setTimeout(() => refresh().catch(showError), 800);
  } catch (e) {
    if (e.status === 'blocked') {
      await refresh().catch(showError);
      $('assembly-status').textContent = '暂不能组装：本次操作未启动，请查看下方原因。';
      $('assembly-status').className = 'warning';
    } else showError(e);
    $(name).disabled = false;
  }
}
$('copy-issues').onclick = async () => {
  const s = records.find(r => r.name === selected);
  const details = [...$('issues').querySelectorAll('h4,p,pre')].map(node => node.textContent).join('\n');
  const report = `材料手册工作台问题详情\n采集时间：${new Date().toISOString()}\n手册：${s.name}\n来源 PDF：${s.pdf}\n\n${$('assembly-status').textContent}\n${[...s.assembly.required, ...s.assembly.pending].join('\n')}\n\n${details}\n\n结构化状态（可按问题代码和路径定位）：\n${JSON.stringify(s, null, 2)}`;
  try {
    await navigator.clipboard.writeText(report);
    $('copy-status').textContent = '已复制，可直接发给 Codex。';
    $('copy-fallback').hidden = true;
  } catch {
    $('copy-fallback').value = report;
    $('copy-fallback').hidden = false;
    $('copy-fallback').select();
    $('copy-status').textContent = '浏览器未允许自动复制，请复制下方已选中的内容。';
  }
};
function showError(e) { $('message').textContent = e.message; }
$('manual').onchange = e => {
  selected = e.target.value;
  $('incomplete').checked = false;
  $('message').textContent = $('copy-status').textContent = '';
  $('copy-fallback').hidden = true;
  render();
};
$('incomplete').onchange = render;
$('intake').onclick = () => action('intake');
$('assemble').onclick = () => action('assemble');
refresh().catch(showError);
setInterval(() => refresh().catch(showError), 3000);
</script></body></html>
