[project]
name = "materials-workbench"
version = "0.1.0"
description = "Materials handbook figure annotation, table review, and assembly"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lxml>=6.1.2",
    "mineru-open-sdk>=0.2.5",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.8.0",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rapidocr>=3.9.2",
]

[dependency-groups]
dev = [
    "babel>=2.17",
    "jinja2>=3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/materials_workbench", "src/chart_annotator", "src/pdf_tree_workflow"]

[project.scripts]
materials-workbench = "materials_workbench.cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [".", "tests/charts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
